name: Release Windows

# Quand une Release est publiée (par tools/publier_macos.sh, qui y met le zip du Mac), ce travail compile scriibe.exe et l'ajoute à la
# même Release sous le nom scriibe-windows-x64.zip : c'est le fichier que l'onglet « Mise à jour » de Scriibe sous Windows télécharge.
# Lancement à la main possible (Actions → Release Windows → Run workflow) pour une Release déjà publiée, avec son étiquette (v0.1.0).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la Release (par exemple v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-zip:
    name: scriibe-windows-x64.zip
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Le numéro de la Release est celui du programme
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=Version::l'étiquette $TAG ne correspond pas à la version de Cargo.toml ($version) : le programme croirait toujours avoir une version en retard."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Interface
        shell: bash
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Compilation
        run: cargo build --release -p scriibe-cli
      - name: Zip et envoi dans la Release
        shell: bash
        run: |
          mkdir out
          cp target/release/scriibe.exe out/
          (cd out && 7z a -tzip ../scriibe-windows-x64.zip scriibe.exe)
          gh release upload "$TAG" scriibe-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
