name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --workspace 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Le détail des échecs est aussi publié en annotation (lisible sans télécharger les journaux).
            msg=$(grep -E -A40 "cas en échec|panicked|^---- |error(\[|:)" test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Échec des tests::$msg"
          fi
          exit $code

  fixtures:
    name: structure des cas de référence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/verifier_fixtures.py

  windows-exe:
    name: scriibe.exe (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Compilation
        run: cargo build --release -p scriibe-cli
      - uses: actions/upload-artifact@v4
        with:
          name: scriibe-windows-x64
          path: target/release/scriibe.exe
          retention-days: 30
