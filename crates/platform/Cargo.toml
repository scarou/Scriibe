[package]
name = "scriibe-platform"
description = "Ce que Scriibe demande au système : touche globale, micro, collage, presse-papiers, clés, icône, dossier de données."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
scriibe-core = { path = "../core", default-features = false }
scriibe-engines = { path = "../engines" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Micro (WASAPI).
cpal = "0.15"
# Sessions audio (quelles applis jouent du son ou captent le micro) pour la pause des médias : les interfaces COM de WASAPI.
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }
# Icône dans la zone de notification.
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
