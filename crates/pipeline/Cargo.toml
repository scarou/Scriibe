[package]
name = "scriibe-pipeline"
description = "Le chef d'orchestre de Scriibe : touche, micro, transcription, mise au propre, collage, historique (port de DictationController)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
scriibe-core = { path = "../core", default-features = false }
scriibe-engines = { path = "../engines" }
scriibe-platform = { path = "../platform" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
scriibe-core = { path = "../core" }
serde_json = "1"
