[package]
name = "scriibe-cli"
description = "Scriibe en ligne de commande, avec une icône dans la zone de notification : premier jalon pour essayer la chaîne de dictée (étape 5)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriibe"
path = "src/main.rs"

[dependencies]
scriibe-core = { path = "../core" }
scriibe-engines = { path = "../engines" }
scriibe-platform = { path = "../platform" }
scriibe-pipeline = { path = "../pipeline" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
# Serveur HTTP local de la page d'essais (127.0.0.1 seulement) et téléchargements (avec confirmation).
tiny_http = "0.12"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-embed = "8"

# La fenêtre (WebView2 sous Windows, WKWebView sous macOS, WebKitGTK sous Linux) ; sous macOS et Linux aussi l'icône de la barre des menus (`tray-icon`) et la pastille
# transparente (`macos-private-api`, réglé aussi dans tauri.conf.json). Une seule section : `tauri-build` exige que les fonctions de la
# dépendance correspondent à tauri.conf.json dans chacune.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "macos-private-api"] }

[build-dependencies]
tauri-build = "2"
