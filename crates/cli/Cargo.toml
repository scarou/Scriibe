[package]
name = "scriibe-cli"
description = "Scriibe en ligne de commande, avec une icône dans la zone de notification : premier jalon pour essayer la chaîne de dictée (étape 5)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriibe"
path = "src/main.rs"

[dependencies]
scriibe-core = { path = "../core" }
scriibe-engines = { path = "../engines" }
scriibe-platform = { path = "../platform" }
scriibe-pipeline = { path = "../pipeline" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
# Serveur HTTP local de la page d'essais (127.0.0.1 seulement) et téléchargements (avec confirmation).
tiny_http = "0.12"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-embed = "8"
