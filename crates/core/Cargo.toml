[package]
name = "scriibe-core"
description = "Logique de texte de Scriibe : signes dictés, listes, typographie, garde-fous, modes. Aucune dépendance système."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["language-detection"]
# Détecte si un texte traduit est « resté en français » (garde-fou de la traduction). Embarque des modèles de langue (≈ 25 Mo).
language-detection = ["dep:lingua"]

[dependencies]
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
lingua = { version = "1", optional = true, default-features = false, features = ["french", "english", "german", "spanish", "italian", "portuguese"] }

[dev-dependencies]
