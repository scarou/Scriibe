[package]
name = "scriibe-engines"
description = "Moteurs locaux de Scriibe : whisper-server et llama-server (modèles, options, état), clients des services de transcription et de mise au propre."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
scriibe-core = { path = "../core", default-features = false }
fancy-regex = "0.14"
serde_json = "1"
# Client HTTP bloquant, sans moteur asynchrone : les appels se font sur des fils de travail.
ureq = { version = "2", default-features = true }
# Retrouver (et arrêter) un serveur resté d'une session précédente, sur tous les systèmes.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
